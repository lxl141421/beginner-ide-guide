name: Auto Update IDE Info

on:
  schedule:
    # 每3个月1号 UTC 8:00 运行
    - cron: '0 8 1 */3 *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_updates.py

      - name: Commit and push if changed
        run: |
          git config user.name "ide-guide-bot"
          git config user.email "ide-guide-bot@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 自动更新: 版本号/日期/链接检查/排序 [$(date -u +%Y-%m-%d)]"
            git push
          fi
