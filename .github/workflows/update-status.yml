name: Check Links Daily

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check links only
        run: |
          python -c "
          import urllib.request, urllib.error, re
          from pathlib import Path

          content = Path('README.md').read_text(encoding='utf-8')
          urls = re.findall(r'\[([^\]]+)\]\((https?://[^)]+)\)', content)
          dead = []
          checked = set()
          for name, url in urls:
              if url in checked:
                  continue
              checked.add(url)
              try:
                  req = urllib.request.Request(url, method='HEAD',
                      headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      if resp.status >= 400:
                          dead.append((name, url, resp.status))
              except urllib.error.HTTPError as e:
                  if e.code >= 500:
                      dead.append((name, url, e.code))
              except Exception as e:
                  dead.append((name, url, str(e)[:50]))
          if dead:
              print('Dead links found:')
              for name, url, err in dead:
                  print(f'  - [{name}]({url}) -> {err}')
          else:
              print(f'All {len(checked)} links OK')
          "

      - name: Commit if README changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "link check [$(date -u +%Y-%m-%d)]"
          git push
